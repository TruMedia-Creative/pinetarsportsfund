  sectionTitle: Expansion Opportunity
  body: |
    The Greenville thesis is a Northeast Texas operating-node thesis: use a Pine Tar/NCS-listed facility to serve league play, rentals, practice demand, and weekend tournament traffic while the team verifies exact facility economics. The page should not state return targets until approved Greenville-specific data is available.
  bullets:
    - NCS-listed Dugout Greenville address and Pine Tar Sports event usage are now reflected in the page.
    - The location gives Pine Tar a Northeast Texas node near Hunt County and the eastern DFW edge.
    - Revenue narrative should focus on tournaments, league play, field rentals, training, and facility improvements once source-backed metrics are approved.
    - Expansion scope, capital need, preferred return, payback, and exit assumptions remain needs-Lar-review items.

