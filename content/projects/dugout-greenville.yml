        Tim Truman brings operating experience, relationship-driven deal access, and practical knowledge of how sports facilities generate demand through tournaments, training, rentals, and community programming. Pine Tar materials describe his approach as operator-led: evaluate local demand, improve or develop facilities where the model can work, and connect those facilities to repeatable programming. Final bio wording should be approved by Tim/Lar before this page is circulated externally.
