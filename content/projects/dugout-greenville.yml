    Dugout Greenville is listed by National Championship Sports as a Greenville, Texas baseball site and appears in Pine Tar Sports event/location pages. The facility fits the broader Dugout model documented in the venture notes: operate or improve sports facilities, create weekday and weekend programming, and connect facility demand to tournament activity.

