investmentThesis:
  enabled: true
  sectionTitle: Expansion Opportunity
  body: |
    The Millsap thesis is a west-DFW operating-node thesis: use an existing Pine Tar/NCS-listed facility to capture local league demand, field rentals, practice usage, and weekend tournament traffic while the team verifies exact economics. The investment case should remain diligence-gated until facility-level revenue, utilization, improvements, and legal offering terms are approved.
  bullets:
    - NCS-listed Dugout Millsap address and Pine Tar Sports event usage are now reflected in the page.
    - The site extends the Dugout model into Parker County and the west Fort Worth / Weatherford trade area.
    - Revenue narrative should focus on tournaments, league play, field rentals, training, and facility improvements once source-backed metrics are approved.
    - Expansion scope, capital need, preferred return, payback, and exit assumptions remain needs-Lar-review items.

