risksDisclaimer:
  enabled: true
  sectionTitle: Risks & Disclaimer
  body: |
    This presentation is for informational and draft-review purposes only and does not constitute an offer to sell or a solicitation to buy any security. Investment involves risk, including the possible loss of principal. Metrics marked pending must be source-verified and approved before investor use.
  bullets:
    - Operating metrics, acreage, field counts, utilization, revenue, and returns remain pending source verification.
    - Construction, renovation, or expansion cost overruns could affect timing and economics.
    - Weather, scheduling, league participation, and tournament demand may disrupt operations.
    - Anchor tenant, partner, lease, and programming terms require final confirmation.
    - Zoning, permitting, insurance, and regulatory requirements may change.
    - Prospective investors should consult independent legal, tax, and financial advisors.

