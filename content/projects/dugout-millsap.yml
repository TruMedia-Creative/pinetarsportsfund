executiveSummary:
  enabled: true
  body: |
    Dugout Millsap is listed by National Championship Sports as a Millsap, Texas baseball site used in Pine Tar Sports programming. The project fits the broader Dugout model documented in the venture notes: improve or operate local sports facilities, drive weekday and weekend activity, and connect facility demand to Pine Tar tournament scheduling.

