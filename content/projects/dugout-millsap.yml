  sectionTitle: Team
  body: |
    Pine Tar Sports Fund is led by operators focused on turning sports-facility opportunities into reviewable, diligence-ready projects. The local notes position Tim Truman as the operator behind the Dugout/Pine Tar model; final role language should be approved before investor distribution.
  members:
    - name: Tim Truman
