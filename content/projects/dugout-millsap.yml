market:
  enabled: true
  sectionTitle: Market Context
  body: |
    Millsap sits in Parker County west of Fort Worth, giving the facility a practical trade-area story around Weatherford, west DFW suburbs, and surrounding youth baseball communities. Pine Tar should validate the exact 60-mile population, household income, participation, and tournament-market figures before any investor metric cards are treated as final.

    The supported market point today is qualitative: this location gives Pine Tar a western DFW-area node that can feed league play, weekend tournament demand, rentals, and practice usage.
